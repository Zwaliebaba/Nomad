# Lint levels live in Cargo.toml under [workspace.lints]. This file only configures lint behaviour.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
# Product names that are not code, for clippy::doc_markdown; ".." keeps the default list.
doc-valid-idents = ["MagicaVoxel", ".."]
