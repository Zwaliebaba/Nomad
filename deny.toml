# Enforces CODING_STANDARDS.md §10 (D-031). Run with `cargo deny check`; CI runs it on every push.
[graph]
# Build and dev tools are exempt from the licence rule; dev-dependencies never ship.
exclude-dev = true

[advisories]
yanked = "deny"
# Notices about transitive crates are not vulnerabilities, and we cannot act on them directly.
unmaintained = "workspace"

[licenses]
# The list mirrors CODING_STANDARDS.md §10, whether or not a dependency uses each licence today.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Our own crates are proprietary and unpublished.
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
