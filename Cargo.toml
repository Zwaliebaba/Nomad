[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/Zwaliebaba/Nomad"

# Shared dependency versions. Crates opt in with `name = { workspace = true }`.
[workspace.dependencies]
nomad-ai = { path = "crates/nomad-ai" }
nomad-link = { path = "crates/nomad-link" }
nomad-protocol = { path = "crates/nomad-protocol" }
nomad-sim = { path = "crates/nomad-sim" }
nomad-types = { path = "crates/nomad-types" }
# The simulation's ECS (D-030). MIT or Apache-2.0. Storage only: identity and order are SimIds.
hecs = { version = "0.11", default-features = false, features = ["std"] }
# Pure-Rust maths for the simulation, identical on every platform (D-049, CODING_STANDARDS.md §8).
libm = "0.2"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Server shell (N2 plan; Design doc 20 §6, §12; D-088).
# Per-user data directory (%LOCALAPPDATA% on Windows, XDG on Linux).
directories = "6.0"
# SQLite with the C library compiled in, so no system SQLite is needed on either OS. The
# statement cache (`cache`) is the only default feature kept.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
# Signals for clean shutdown (Ctrl+C, SIGTERM), and the network threads' runtime (N3): `net`
# for quinn's UDP sockets, `time` for timeouts, `sync` for channels, `macros` for select!.
tokio = { version = "1.54", default-features = false, features = ["rt", "signal", "net", "time", "sync", "macros"] }

# Transport (N3 plan §8; D-087). QUIC over UDP, on 127.0.0.1 by default; TLS 1.3 with the
# `ring` provider, because aws-lc-rs would need CMake and NASM on Windows. All MIT or
# Apache-2.0 (ring: Apache-2.0 AND ISC).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The server's self-signed certificate (D-087, D-151).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# SHA-256 fingerprints and random tokens.
ring = "0.17"
# The local UTC offset, for `create --window`'s default of local 19:00 (D-157). Already in the
# tree through rcgen; `local-offset` adds only num_threads. MIT or Apache-2.0.
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"] }

# MagicaVoxel `.vox` reading and writing for the voxel art pipeline (nomad-vox, D-289). MIT.
# A build tool only: no shipped binary links it. The default `ahash` feature is left out.
dot_vox = { version = "5.2", default-features = false }

# Client (phase-1 visual slice, Design D-004, phase-1 doc 05).
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
# Text for world labels and the HUD (phase-1 doc 05 "Text"); MIT OR Apache-2.0 OR Zlib.
glyphon = "0.12"
png = "0.18"
pollster = "1.0"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Backends: DX12 and Vulkan on Windows, Vulkan on Linux, GLES as the fallback on both.
# All are loaded at run time, so building needs no system packages.
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "gles"] }
# X11 and Wayland on Linux, both loaded at run time; no client-side decoration theme.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

# Optimise dependencies only, so the wgpu client starts about twice as fast while our own crates
# stay unoptimised and fully debuggable. This is still the Debug profile (D-010).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# Every crate opts in with `[lints] workspace = true`. CI runs clippy with `-D warnings`,
# so every `warn` below is an error in CI. Rationale: CODING_STANDARDS.md, section "Lints".
[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are mostly noise in rendering and simulation code.
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
# Restriction lints we opt into.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
