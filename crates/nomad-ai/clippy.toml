# Replaces the root clippy.toml for this crate, so the first four lines repeat it.
# The rest enforces CODING_STANDARDS.md §8 and D-049: nomad-ai runs inside the deterministic
# step (D-050, D-199), so it follows nomad-sim's rules.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

disallowed-methods = [
  { path = "std::time::Instant::now", reason = "time is the tick counter (CODING_STANDARDS.md §8)" },
  { path = "std::time::SystemTime::now", reason = "time is the tick counter (CODING_STANDARDS.md §8)" },
  { path = "std::thread::spawn", reason = "nomad-ai starts no threads (CODING_STANDARDS.md §8)" },
