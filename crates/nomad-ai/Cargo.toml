[package]
name = "nomad-ai"
description = "Nomad's AI: the Deputy, the Strategist and the raider director, seeing the Universe only through the View trait (Design D-077, D-199; A1 plan §4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# nomad-types, serde, libm and rand_chacha only (D-199, A1 plan §4.1, §4.6): nomad-sim depends
# on this crate, so the AI can never name the simulation state. The manifest test in src/lib.rs
# keeps it that way. libm gives the raider director's geometry the same square root on every
# platform (D-049); rand_chacha runs the AI's seeded streams, as it runs the simulation's.
[dependencies]
libm = { workspace = true }
nomad-types = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
